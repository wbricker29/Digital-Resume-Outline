  # About personal section
  - id: about-personal
    type: narrative
    heading: "About Me"
    markdown: |
      At my core, I am a **problem solver** who thrives at the intersection of AI, finance, and business strategy.

      My journey has evolved from managing portfolios at Bridgewater and J.P. Morgan to building AI solutions that help financial institutions work smarter. Here's what I bring to the table:

      ### AI & Product Development

      I've spent the past few years immersed in building practical AI solutionsâfrom LLM-powered research tools to automated investing. I love taking complex problems and turning them into products that actually work in production, not just in demos.

      ### Financial Services Background

      A decade in quantitative investing and venture capital taught me how financial institutions really operateâthe workflows, the pain points, the opportunities. This helps me build AI solutions that fit naturally into existing processes rather than forcing change for change's sake.

      ### Business-First Thinking

      Whether I'm coding a prototype or leading a cross-functional team, I always start with the business problem. I've learned that the best technology solutions come from deeply understanding what drives value and what gets in the way.

      In the next stage of my career, I'm looking to work with teams that share my excitement about using AI to solve real business challengesânot because it's trendy, but because it is what love and where I can deliver meaningful value.

  # Experience section
  - id: about-experience
    type: narrative
    heading: "Experience"
    markdown: |
      **TL;DR**: 10 years of work experience in finance + AI, MBA from Berkeley

      - **2 years** at JP Morgan helping run the Asset Management FICC Trading Group
      - **4 years** at Bridgewater, managing portions of the investment group and doing research for the founder
      - **~1 year** as interim COO of a pivoting startup
      - **3+ years** at Hustle Fund, investing in pre-seed startups and building a data-driven investing platform
      - **1 year** building AI solutions for private market funds
      - **3 months** founding startup (Completed 'start', failed to complete 'up')

